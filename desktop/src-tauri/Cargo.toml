[package]
name = "mq-player-desktop"
version = "1.0.0"
description = "MQ Player — desktop client for Windows"
authors = ["MQ Team"]
edition = "2021"
license = "MIT"

[lib]
name = "mq_player_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "devtools"] }
tauri-plugin-notification = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "stream", "json"] }
http = "1"
futures-util = "0.3"
rand = "0.8"
percent-encoding = "2"
log = "0.4"

# Windows: OS media controls (SMTC) + DPAPI-protected session storage.
# default-features off → no Linux/MPRIS backend deps (Windows-only usage).
[target.'cfg(windows)'.dependencies]
souvlaki = { version = "0.8", default-features = false }
windows = { version = "0.60", features = [
  "Win32_Security_Cryptography",
  "Win32_System_Com",
  "Win32_System_Memory",
  "Win32_Foundation",
] }

[profile.release]
# Low-memory build box (2 cores / 4 GB): keep the binary small but the
# build tractable — no LTO, no codegen-unit starvation.
opt-level = 2
lto = false
codegen-units = 16
strip = true
