<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <title>MQ Player</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap"
      rel="stylesheet"
    />
    <style>
      html, body { margin: 0; padding: 0; background: #0e0e0e; }
      #mq-boot-splash {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: #0e0e0e; z-index: 2147483647; transition: opacity .35s ease;
      }
      #mq-boot-splash.done { opacity: 0; pointer-events: none; }
      @keyframes mqBootPulse { 0%,100% { opacity:.55 } 50% { opacity:1 } }
    </style>
    <script>
      // Pre-paint theme — same contract as web layout.tsx (no flash of wrong theme).
      (function () {
        try {
          var raw = localStorage.getItem("mq-store-v8");
          var t = raw ? (JSON.parse(raw).state || {}).theme : null;
          var root = document.documentElement;
          if (t === "daylight") {
            root.style.setProperty("--mq-bg", "#f8f9fa");
            root.style.setProperty("--mq-card", "#ffffff");
            root.style.setProperty("--mq-text", "#212529");
            root.style.setProperty("--mq-text-muted", "#6c757d");
            root.style.backgroundColor = "#f8f9fa";
          } else if (t === "midnight" || t === "black") {
            root.style.setProperty("--mq-bg", "#000000");
            root.style.backgroundColor = "#000000";
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="mq-boot-splash">
      <svg width="52" height="52" viewBox="0 0 512 512" style="animation: mqBootPulse 2.4s ease-in-out infinite">
        <rect x="24" y="24" width="464" height="464" rx="112" fill="#14141f"/>
        <text x="256" y="316" text-anchor="middle" font-family="Manrope, system-ui, sans-serif" font-weight="800" font-size="204" fill="#e03131">mq</text>
        <circle cx="416" cy="96" r="26" fill="#e03131"/>
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
