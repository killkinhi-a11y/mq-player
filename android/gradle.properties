# JVM: sandbox/CI-friendly caps (2GB cgroup). Raise for local dev if you have RAM.
org.gradle.jvmargs=-Xmx1600m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx896m
kotlin.compiler.execution.strategy=in-process
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=false

kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true

# Base API. For local backend development against `next dev`:
#   ./gradlew -PmqApiBase=http://10.0.2.2:3000 assembleDebug
mqApiBase=https://mq1.vercel.app
