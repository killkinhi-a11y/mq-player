<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --mq-bg: #0a0a0f; }
  body { margin: 0; background: #050508; font: 12px monospace; color: #9aa; }
  .row { margin-bottom: 14px; }
  .lbl { padding: 2px 0 4px; }
  .band { position: relative; width: 1128px; height: 159px; overflow: hidden; background: #030305; }
  .covers { position: absolute; inset: 0; display: flex; }
  .covers img { height: 100%; flex: 1; min-width: 0; object-fit: cover; }
  .melt { position: absolute; inset: 0;
    background:
      linear-gradient(180deg, rgba(203,213,225,0.15) 0%, rgba(203,213,225,0.14) 8%,
      rgba(203,213,225,0) 12%,
      #030305 13%,
      rgba(3,3,5,0.80) 20%,
      rgba(3,3,5,0.88) 30%,
      rgba(3,3,5,0.25) 40%,
      rgba(3,3,5,0.5) 74%,
      rgba(3,3,5,0.88) 88%,
      rgba(3,3,5,0.95) 100%);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
  .radials { position: absolute; inset: 0;
    background: radial-gradient(44% 96% at 34% 103%, rgba(226,232,240,0.035), transparent 58%),
                radial-gradient(9% 4% at 16% 96.5%, rgba(226,232,240,0.5), rgba(226,232,240,0.14) 55%, transparent 78%); }
  svg.streaks { position: absolute; inset: 0; width: 100%; height: 100%; }
  .midsheen { position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent 0%, rgba(203,213,225,0.05) 10%,
      rgba(203,213,225,0.075) 34%, rgba(203,213,225,0.05) 52%, rgba(203,213,225,0.02) 62%, transparent 70%);
    -webkit-mask-image: linear-gradient(180deg, transparent 15%, #000 36%, #000 64%, transparent 88%);
    mask-image: linear-gradient(180deg, transparent 15%, #000 36%, #000 64%, transparent 88%); }
  .topglow { position: absolute; top: 0; left: 0; right: 0; height: 4.4%;
    background: linear-gradient(90deg, transparent 11%, rgba(226,232,240,0.44) 14%,
      rgba(226,232,240,0.54) 20%, rgba(226,232,240,0.5) 26%, rgba(226,232,240,0.34) 32%,
      rgba(226,232,240,0.38) 38%, rgba(226,232,240,0.42) 45%, rgba(226,232,240,0.34) 50%,
      rgba(226,232,240,0.1) 55%, transparent 58%);
    -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 40%, transparent 100%);
    mask-image: linear-gradient(180deg, #000 0%, #000 40%, transparent 100%); }
</style>
</head>
<body>
<!-- v5 substrate: dimmed real covers (ambient, unreadable photo content) -->
<template id="substrate">
  <div class="covers">
    <img src="cov0.jpg" style="filter: grayscale(1) brightness(0.33) contrast(1.8) blur(2.5px); opacity: 1.0; transform: rotate(-1deg) scale(7.2, 0.56); transform-origin: 44% 34%;">
    <img src="cov1.jpg" style="filter: grayscale(1) brightness(0.28) contrast(1.4) blur(2px); opacity: 1.0; transform: rotate(-2.5deg) scale(5.6, 0.10); transform-origin: 57% 48%;">
    <img src="cov2.jpg" style="filter: grayscale(1) brightness(0.31) contrast(1.6) blur(2.5px); opacity: 0.95; transform: rotate(1.5deg) scale(6.4, 0.40); transform-origin: 48% 8%;">
    <img src="cov0.jpg" style="filter: grayscale(1) brightness(0.33) contrast(1.8) blur(2.5px); opacity: 0.82; transform: rotate(-1deg) scale(7.2, 0.56); transform-origin: 44% 34%;">
    <img src="cov1.jpg" style="filter: grayscale(1) brightness(0.28) contrast(1.4) blur(2px); opacity: 0.82; transform: rotate(-2.5deg) scale(5.6, 0.10); transform-origin: 57% 48%;">
    <img src="cov2.jpg" style="filter: grayscale(1) brightness(0.31) contrast(1.6) blur(2.5px); opacity: 0.77; transform: rotate(1.5deg) scale(6.4, 0.40); transform-origin: 48% 8%;">
    <img src="cov0.jpg" style="filter: grayscale(1) brightness(0.33) contrast(1.8) blur(2.5px); opacity: 0.64; transform: rotate(-1deg) scale(7.2, 0.56); transform-origin: 44% 34%;">
    <img src="cov1.jpg" style="filter: grayscale(1) brightness(0.28) contrast(1.4) blur(2px); opacity: 0.64; transform: rotate(-2.5deg) scale(5.6, 0.10); transform-origin: 57% 48%;">
    <img src="cov2.jpg" style="filter: grayscale(1) brightness(0.31) contrast(1.6) blur(2.5px); opacity: 0.59; transform: rotate(1.5deg) scale(6.4, 0.40); transform-origin: 48% 8%;">
  </div>
  <div class="melt"></div>
</template>

<!-- SYNTHETIC CHROME STREAK LAYER (the v5 deliverable; ported to MainView as-is) -->
<template id="streaks">
  <svg class="streaks" viewBox="0 0 1128 160" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <filter id="mqCsGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4"/></filter>
      <filter id="mqCsAir" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="6"/></filter>
      <filter id="mqCsBody" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="2.2"/></filter>
      <filter id="mqCsCore" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="0.6"/></filter>
      <!-- shallow single-dip gradients: chrome trails hold bright plateaus and
           breathe moderately along their length (ref: 251->235->210 fade) -->
      <linearGradient id="mqCsGa" gradientUnits="userSpaceOnUse" x1="420" y1="98" x2="672" y2="94">
        <stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.1" stop-color="#ffffff" stop-opacity="0.6"/><stop offset="0.34" stop-color="#ffffff" stop-opacity="0.9"/><stop offset="0.52" stop-color="#ffffff" stop-opacity="0.8"/><stop offset="0.7" stop-color="#ffffff" stop-opacity="0.92"/><stop offset="0.78" stop-color="#ffffff" stop-opacity="0.18"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="mqCsGb" gradientUnits="userSpaceOnUse" x1="435" y1="106" x2="684" y2="102">
        <stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.14" stop-color="#ffffff" stop-opacity="0.55"/><stop offset="0.42" stop-color="#ffffff" stop-opacity="0.95"/><stop offset="0.6" stop-color="#ffffff" stop-opacity="0.7"/><stop offset="0.78" stop-color="#ffffff" stop-opacity="0.9"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="mqCsGc" gradientUnits="userSpaceOnUse" x1="390" y1="54" x2="582" y2="56">
        <stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.16" stop-color="#ffffff" stop-opacity="0.55"/><stop offset="0.38" stop-color="#ffffff" stop-opacity="0.95"/><stop offset="0.56" stop-color="#ffffff" stop-opacity="0.82"/><stop offset="0.74" stop-color="#ffffff" stop-opacity="0.9"/><stop offset="0.92" stop-color="#ffffff" stop-opacity="0.3"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="mqCsGd" gradientUnits="userSpaceOnUse" x1="270" y1="40" x2="638" y2="34">
        <stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.12" stop-color="#ffffff" stop-opacity="0.8"/><stop offset="0.3" stop-color="#ffffff" stop-opacity="0.62"/><stop offset="0.48" stop-color="#ffffff" stop-opacity="0.92"/><stop offset="0.64" stop-color="#ffffff" stop-opacity="0.6"/><stop offset="0.82" stop-color="#ffffff" stop-opacity="0.75"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="mqCsGe" gradientUnits="userSpaceOnUse" x1="300" y1="62" x2="680" y2="106">
        <stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.16" stop-color="#ffffff" stop-opacity="0.45"/><stop offset="0.4" stop-color="#ffffff" stop-opacity="0.75"/><stop offset="0.62" stop-color="#ffffff" stop-opacity="0.5"/><stop offset="0.82" stop-color="#ffffff" stop-opacity="0.6"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="mqCsGf" gradientUnits="userSpaceOnUse" x1="336" y1="100" x2="624" y2="111">
        <stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.14" stop-color="#ffffff" stop-opacity="0.75"/><stop offset="0.34" stop-color="#ffffff" stop-opacity="0.56"/><stop offset="0.56" stop-color="#ffffff" stop-opacity="0.68"/><stop offset="0.9" stop-color="#ffffff" stop-opacity="0.95"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      </linearGradient>
            <linearGradient id="mqCsGm1" gradientUnits="userSpaceOnUse" x1="128" y1="76" x2="256" y2="79">
        <stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.2" stop-color="#ffffff" stop-opacity="0.5"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.72"/><stop offset="0.8" stop-color="#ffffff" stop-opacity="0.45"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="mqCsGm2" gradientUnits="userSpaceOnUse" x1="136" y1="132" x2="268" y2="136">
        <stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.22" stop-color="#ffffff" stop-opacity="0.55"/><stop offset="0.55" stop-color="#ffffff" stop-opacity="0.74"/><stop offset="0.85" stop-color="#ffffff" stop-opacity="0.34"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      </linearGradient>
            <linearGradient id="mqCsGm3" gradientUnits="userSpaceOnUse" x1="372" y1="106" x2="214" y2="126">
        <stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.18" stop-color="#ffffff" stop-opacity="0.55"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.75"/><stop offset="0.8" stop-color="#ffffff" stop-opacity="0.45"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="mqCsGl" gradientUnits="userSpaceOnUse" x1="-30" y1="78" x2="122" y2="112">
        <stop offset="0" stop-color="#ffffff" stop-opacity="0.2"/><stop offset="0.22" stop-color="#ffffff" stop-opacity="0.85"/><stop offset="0.45" stop-color="#ffffff" stop-opacity="1"/><stop offset="0.85" stop-color="#ffffff" stop-opacity="0.95"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      </linearGradient>
            <linearGradient id="mqCsGr2" gradientUnits="userSpaceOnUse" x1="698" y1="46" x2="822" y2="46">
        <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.55"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="mqCsGr" gradientUnits="userSpaceOnUse" x1="1164" y1="74" x2="1018" y2="78">
        <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/><stop offset="0.35" stop-color="#ffffff" stop-opacity="0.3"/><stop offset="0.75" stop-color="#ffffff" stop-opacity="0.12"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <!-- A: MAIN FAT RIBBON (ref fat run): dual staggered paths = internal banding -->
    <path d="M 420 98 C 510 84, 610 104, 672 94" fill="none" stroke="url(#mqCsGa)" stroke-width="30" stroke-linecap="round" opacity="0.07" filter="url(#mqCsAir)"/>
    <path d="M 420 98 C 510 84, 610 104, 672 94" fill="none" stroke="url(#mqCsGa)" stroke-width="20" stroke-linecap="round" opacity="0.2" filter="url(#mqCsGlow)"/>
    <path d="M 420 98 C 510 84, 610 104, 672 94" fill="none" stroke="url(#mqCsGa)" stroke-width="9" stroke-linecap="round" opacity="0.64" filter="url(#mqCsBody)"/>
    <path d="M 420 98 C 510 84, 610 104, 672 94" fill="none" stroke="url(#mqCsGa)" stroke-width="5.6" stroke-linecap="round" opacity="1" filter="url(#mqCsCore)"/>
    <path d="M 435 106 C 530 92, 625 110, 684 102" fill="none" stroke="url(#mqCsGb)" stroke-width="16" stroke-linecap="round" opacity="0.18" filter="url(#mqCsGlow)"/>

    <path d="M 435 106 C 530 92, 625 110, 684 102" fill="none" stroke="url(#mqCsGb)" stroke-width="4.8" stroke-linecap="round" opacity="0.97" filter="url(#mqCsCore)"/>
    <!-- B: mid double-crest ribbon -->
    <path d="M 390 54 C 465 40, 540 66, 582 56" fill="none" stroke="url(#mqCsGc)" stroke-width="22" stroke-linecap="round" opacity="0.06" filter="url(#mqCsAir)"/>
    <path d="M 390 54 C 465 40, 540 66, 582 56" fill="none" stroke="url(#mqCsGc)" stroke-width="13" stroke-linecap="round" opacity="0.16" filter="url(#mqCsGlow)"/>
    <path d="M 390 54 C 465 40, 540 66, 582 56" fill="none" stroke="url(#mqCsGc)" stroke-width="6" stroke-linecap="round" opacity="0.52" filter="url(#mqCsBody)"/>
    <path d="M 390 54 C 465 40, 540 66, 582 56" fill="none" stroke="url(#mqCsGc)" stroke-width="3.9" stroke-linecap="round" opacity="0.96" filter="url(#mqCsCore)"/>
    <path d="M 400 63 C 475 49, 545 74, 594 64" fill="none" stroke="url(#mqCsGc)" stroke-width="5" stroke-linecap="round" opacity="0.42" filter="url(#mqCsBody)"/>
    <!-- C: upper thin arc, long, gradual fade 251->235->210 -->
    <path d="M 270 40 C 400 24, 515 50, 638 34" fill="none" stroke="url(#mqCsGd)" stroke-width="16" stroke-linecap="round" opacity="0.05" filter="url(#mqCsAir)"/>
    <path d="M 270 40 C 400 24, 515 50, 638 34" fill="none" stroke="url(#mqCsGd)" stroke-width="10" stroke-linecap="round" opacity="0.14" filter="url(#mqCsGlow)"/>
    <path d="M 270 40 C 400 24, 515 50, 638 34" fill="none" stroke="url(#mqCsGd)" stroke-width="5.5" stroke-linecap="round" opacity="0.54" filter="url(#mqCsBody)"/>
    <path d="M 270 40 C 400 24, 515 50, 638 34" fill="none" stroke="url(#mqCsGd)" stroke-width="3.7" stroke-linecap="round" opacity="0.9"" /> filter="url(#mqCsCore)"/>
    <!-- D: crossing diagonal spine -->
    <path d="M 300 62 C 440 68, 560 88, 680 106" fill="none" stroke="url(#mqCsGe)" stroke-width="11" stroke-linecap="round" opacity="0.14" filter="url(#mqCsGlow)"/>
    <path d="M 300 62 C 440 68, 560 88, 680 106" fill="none" stroke="url(#mqCsGe)" stroke-width="5.5" stroke-linecap="round" opacity="0.48" filter="url(#mqCsBody)"/>
    <path d="M 300 62 C 440 68, 560 88, 680 106" fill="none" stroke="url(#mqCsGe)" stroke-width="3" stroke-linecap="round" opacity="0.85" filter="url(#mqCsCore)"/>
    <!-- E: low dim multi-peak ribbon -->
    <path d="M 336 100 C 430 94, 520 108, 560 104 C 592 110, 632 114, 652 110" fill="none" stroke="url(#mqCsGf)" stroke-width="9" stroke-linecap="round" opacity="0.13" filter="url(#mqCsGlow)"/>
    <path d="M 336 100 C 430 94, 520 108, 560 104 C 592 110, 632 114, 652 110" fill="none" stroke="url(#mqCsGf)" stroke-width="5.5" stroke-linecap="round" opacity="0.6" filter="url(#mqCsBody)"/>
    <path d="M 336 100 C 430 94, 520 108, 560 104 C 592 110, 632 114, 652 110" fill="none" stroke="url(#mqCsGf)" stroke-width="2.8" stroke-linecap="round" opacity="0.88" filter="url(#mqCsCore)"/>
    <!-- M1: bridge-mid dim run (ref x~132-226 y~69 @164): pool -> cluster flow -->
    <path d="M 128 76 C 172 70, 214 84, 256 79" fill="none" stroke="url(#mqCsGm1)" stroke-width="8" stroke-linecap="round" opacity="0.12" filter="url(#mqCsGlow)"/>
    <path d="M 128 76 C 172 70, 214 84, 256 79" fill="none" stroke="url(#mqCsGm1)" stroke-width="6" stroke-linecap="round" opacity="0.55" filter="url(#mqCsBody)"/>
    <path d="M 128 76 C 172 70, 214 84, 256 79" fill="none" stroke="url(#mqCsGm1)" stroke-width="2.8" stroke-linecap="round" opacity="0.72" filter="url(#mqCsCore)"/>
    <!-- M2: bridge-low dim run (ref x~132-230 y~125-145 @124-162) -->
    <path d="M 136 132 C 182 126, 224 140, 268 136" fill="none" stroke="url(#mqCsGm2)" stroke-width="7" stroke-linecap="round" opacity="0.1" filter="url(#mqCsGlow)"/>
    <path d="M 136 132 C 182 126, 224 140, 268 136" fill="none" stroke="url(#mqCsGm2)" stroke-width="5.5" stroke-linecap="round" opacity="0.52" filter="url(#mqCsBody)"/>
    <path d="M 136 132 C 182 126, 224 140, 268 136" fill="none" stroke="url(#mqCsGm2)" stroke-width="2.2" stroke-linecap="round" opacity="0.6" filter="url(#mqCsCore)"/>
        <!-- M3: descending diagonal tail (ref y67-81%: x368 y107 -> x218 y125) -->
    <path d="M 372 106 C 320 110, 262 116, 214 126" fill="none" stroke="url(#mqCsGm3)" stroke-width="8" stroke-linecap="round" opacity="0.12" filter="url(#mqCsGlow)"/>
    <path d="M 372 106 C 320 110, 262 116, 214 126" fill="none" stroke="url(#mqCsGm3)" stroke-width="5.5" stroke-linecap="round" opacity="0.56" filter="url(#mqCsBody)"/>
    <path d="M 372 106 C 320 110, 262 116, 214 126" fill="none" stroke="url(#mqCsGm3)" stroke-width="2.8" stroke-linecap="round" opacity="0.78" filter="url(#mqCsCore)"/>
    <!-- L: left glare POOL (sustained bright plateau) -->
    <path d="M -30 78 C 15 74, 75 88, 122 112" fill="none" stroke="url(#mqCsGl)" stroke-width="34" stroke-linecap="round" opacity="0.07" filter="url(#mqCsAir)"/>
    <path d="M -30 78 C 15 74, 75 88, 122 112" fill="none" stroke="url(#mqCsGl)" stroke-width="30" stroke-linecap="round" opacity="0.32" filter="url(#mqCsGlow)"/>
    <path d="M -30 78 C 15 74, 75 88, 122 112" fill="none" stroke="url(#mqCsGl)" stroke-width="19" stroke-linecap="round" opacity="0.84" filter="url(#mqCsBody)"/>
    <path d="M -30 78 C 15 74, 75 88, 122 112" fill="none" stroke="url(#mqCsGl)" stroke-width="7" stroke-linecap="round" opacity="1" filter="url(#mqCsCore)"/>

  </svg>
</template>

<script>
  const sub = document.getElementById('substrate').content;
  const stk = document.getElementById('streaks').content;
  function row(label, build) {
    const r = document.createElement('div'); r.className = 'row';
    const l = document.createElement('div'); l.className = 'lbl'; l.textContent = label;
    const b = document.createElement('div'); b.className = 'band';
    build(b); r.append(l, b); document.body.appendChild(r);
  }
  const tg = () => { const f = document.createElement('div'); f.className = 'midsheen'; const d = document.createElement('div'); d.className = 'topglow'; return [f, d]; };
  row('1 SUBSTRATE ONLY (dimmed covers + melt)', b => b.append(sub.cloneNode(true), tg()));
  row('2 FULL V5 (substrate + synthetic chrome streaks)', b => {
    b.append(sub.cloneNode(true), tg(), stk.cloneNode(true));
  });
  row('3 STREAKS ONLY on black (isolation)', b => b.append(stk.cloneNode(true)));
  row('4 STREAKS + radials (no substrate)', b => {
    b.append(stk.cloneNode(true));
    const rd = document.createElement('div'); rd.className = 'radials'; b.appendChild(rd);
  });
  row('5 FULL V5 + radials (final candidate)', b => {
    b.append(sub.cloneNode(true), tg(), stk.cloneNode(true));
    const rd = document.createElement('div'); rd.className = 'radials'; b.appendChild(rd);
  });
</script>
</body>
</html>
