<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<title>MQ Player</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #0e0e0e;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  .container {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 32px; text-align: center;
  }
  .logo {
    width: 88px; height: 88px; border-radius: 24px;
    background: linear-gradient(135deg, #e03131, #a02828);
    display: flex; align-items: center; justify-content: center;
    font-size: 36px; font-weight: 800; color: #fff;
    box-shadow: 0 0 60px rgba(224,49,49,0.45);
    margin-bottom: 28px;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { transform: scale(1); box-shadow: 0 0 60px rgba(224,49,49,0.45); }
    50% { transform: scale(1.06); box-shadow: 0 0 80px rgba(224,49,49,0.65); }
  }
  .title {
    font-size: 24px; font-weight: 600; margin-bottom: 8px;
    letter-spacing: -0.02em;
  }
  .subtitle {
    font-size: 14px; color: rgba(255,255,255,0.5); margin-bottom: 32px;
    line-height: 1.5;
  }
  .retry-btn {
    background: linear-gradient(135deg, #e03131, #a02828);
    color: #fff; border: none;
    padding: 14px 32px; border-radius: 14px;
    font-size: 15px; font-weight: 600;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(224,49,49,0.35);
    transition: transform 0.15s ease;
  }
  .retry-btn:active { transform: scale(0.96); }
  .spinner {
    width: 24px; height: 24px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.15);
    border-top-color: #e03131;
    animation: spin 0.8s linear infinite;
    margin-top: 24px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="container">
  <div class="logo">mq</div>
  <div class="title">MQ Player</div>
  <div class="subtitle" id="msg">Подключение к серверу…</div>
  <button class="retry-btn" id="retry" style="display:none" onclick="retry()">Повторить</button>
  <div class="spinner" id="spinner"></div>
</div>
<script>
(function(){
  var PROD_URL = "https://mq1.vercel.app/play";
  var msg = document.getElementById('msg');
  var retry = document.getElementById('retry');
  var spinner = document.getElementById('spinner');

  // Try to load the prod URL. If it works (online), redirect there.
  // If it fails (offline), show retry button.
  function tryConnect() {
    msg.textContent = 'Подключение к серверу…';
    retry.style.display = 'none';
    spinner.style.display = 'block';
    var probe = new Image();
    var done = false;
    probe.onload = function() {
      if (done) return; done = true;
      // Server reachable — redirect
      window.location.replace(PROD_URL);
    };
    probe.onerror = function() {
      if (done) return; done = true;
      // Image errors but server may still be up (CORS) — try redirect anyway
      setTimeout(function() { window.location.replace(PROD_URL); }, 500);
    };
    probe.src = "https://mq1.vercel.app/icon-192.png?t=" + Date.now();

    // Safety: after 6s, assume offline
    setTimeout(function() {
      if (done) return; done = true;
      msg.textContent = 'Нет соединения с интернетом. Проверьте подключение и повторите.';
      retry.style.display = 'block';
      spinner.style.display = 'none';
    }, 6000);
  }

  window.retry = tryConnect;
  tryConnect();
})();
</script>
</body>
</html>
