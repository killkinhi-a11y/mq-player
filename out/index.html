<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<title>MQ Player</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #0e0e0e; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; overflow: hidden; -webkit-tap-highlight-color: transparent; }
  #app { width: 100%; height: 100%; }
  .loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; z-index: 10; }
  .logo { width: 72px; height: 72px; border-radius: 20px; background: linear-gradient(135deg, #e03131, #a02828); display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 800; color: #fff; box-shadow: 0 0 40px rgba(224,49,49,0.4); animation: pulse 1.8s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  .spinner { width: 24px; height: 24px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.15); border-top-color: #e03131; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .offline { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 32px; text-align: center; z-index: 20; }
  .offline.show { display: flex; }
  .offline .title { font-size: 22px; font-weight: 600; margin-bottom: 8px; }
  .offline .subtitle { font-size: 14px; color: rgba(255,255,255,0.5); margin-bottom: 28px; line-height: 1.5; }
  .retry-btn { background: linear-gradient(135deg, #e03131, #a02828); color: #fff; border: none; padding: 14px 32px; border-radius: 14px; font-size: 15px; font-weight: 600; cursor: pointer; box-shadow: 0 8px 24px rgba(224,49,49,0.35); transition: transform 0.15s ease; }
  .retry-btn:active { transform: scale(0.96); }
  iframe { width: 100%; height: 100%; border: none; }
</style>
</head>
<body>
<div id="app">
  <!-- Loader shown while checking connection -->
  <div class="loader" id="loader">
    <div class="logo">mq</div>
    <div class="spinner"></div>
  </div>
  <!-- Offline screen -->
  <div class="offline" id="offline">
    <div class="logo">mq</div>
    <div class="title">Нет интернета</div>
    <div class="subtitle" id="msg">Проверьте подключение к сети и повторите попытку</div>
    <button class="retry-btn" onclick="checkAndLoad()">Повторить</button>
  </div>
  <!-- Prod app loaded in iframe (keeps our offline detection active) -->
  <iframe id="appFrame" style="display:none"></iframe>
</div>
<script>
var PROD_URL = "https://mq1.vercel.app/play";
var loader = document.getElementById('loader');
var offline = document.getElementById('offline');
var frame = document.getElementById('appFrame');
var msg = document.getElementById('msg');

function checkAndLoad() {
  loader.style.display = 'flex';
  offline.classList.remove('show');
  frame.style.display = 'none';

  // Try to load a small image from prod to check connection
  var img = new Image();
  var done = false;
  img.onload = function() {
    if (done) return; done = true;
    // Online — load prod app in iframe
    loader.style.display = 'none';
    frame.src = PROD_URL;
    frame.style.display = 'block';
    // Also try to set location (in case iframe is blocked)
    setTimeout(function() {
      if (frame.contentWindow && frame.contentWindow.document) {
        // iframe loaded successfully
      } else {
        // Fallback: redirect
        window.location.replace(PROD_URL);
      }
    }, 500);
  };
  img.onerror = function() {
    if (done) return; done = true;
    // Offline — show offline screen
    loader.style.display = 'none';
    offline.classList.add('show');
  };
  // Timeout after 6 seconds
  setTimeout(function() {
    if (!done) { done = true; loader.style.display = 'none'; offline.classList.add('show'); }
  }, 6000);
  img.src = "https://mq1.vercel.app/icon-192.png?t=" + Date.now();
}

// Start immediately
checkAndLoad();

// Monitor connection while app is running
window.addEventListener('online', function() {
  if (offline.classList.contains('show')) {
    msg.textContent = 'Соединение восстановлено...';
    setTimeout(checkAndLoad, 500);
  }
});
window.addEventListener('offline', function() {
  loader.style.display = 'none';
  frame.style.display = 'none';
  offline.classList.add('show');
});
</script>
</body>
</html>
