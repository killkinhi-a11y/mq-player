# ─────────────────────────────────────────────────────────────────────────────
# MQ Player — monorepo CI (checks only)
#
# One job per platform. Path filters skip platforms a PR does not touch;
# push to main/master/develop and manual runs always check everything.
# No secrets are used, so the workflow is safe for pull requests from forks.
# Related workflows: vercel-deploy.yml, security.yml, bundle-analysis.yml,
# build-android.yml (release). Details: docs/CI.md
# ─────────────────────────────────────────────────────────────────────────────
name: CI

"on":
  pull_request:
  push:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.out.outputs.web }}
      desktop: ${{ steps.out.outputs.desktop }}
      rust: ${{ steps.out.outputs.rust }}
      android: ${{ steps.out.outputs.android }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            web:
              - '.github/workflows/ci.yml'
              - 'src/**'
              - 'public/**'
              - 'prisma/**'
              - 'scripts/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'
              - 'next.config.*'
              - 'eslint.config.*'
              - 'vitest.config.*'
              - 'postcss.config.*'
              - 'tailwind.config.*'
              - 'shared/**'
            desktop:
              - '.github/workflows/ci.yml'
              - 'desktop/**'
              - 'src/**'
              - 'shared/**'
              - 'package-lock.json'
              - 'eslint.config.*'
            rust:
              - '.github/workflows/ci.yml'
              - 'audio-engine/**'
            android:
              - '.github/workflows/ci.yml'
              - 'android/**'
              - 'shared/**'
              - 'download/screens/parity/**'
      - id: out
        env:
          EVENT: ${{ github.event_name }}
          WEB: ${{ steps.filter.outputs.web }}
          DESKTOP: ${{ steps.filter.outputs.desktop }}
          RUST: ${{ steps.filter.outputs.rust }}
          ANDROID: ${{ steps.filter.outputs.android }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then WEB=true DESKTOP=true RUST=true ANDROID=true; fi
          { echo "web=$WEB"; echo "desktop=$DESKTOP"; echo "rust=$RUST"; echo "android=$ANDROID"; } >> "$GITHUB_OUTPUT"
          echo "web=$WEB desktop=$DESKTOP rust=$RUST android=$ANDROID"

  # ── Web (Next.js) ──────────────────────────────────────────────────────────
  web-lint:
    name: Web · Lint
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      # desktop/ is linted by the desktop job
      - run: npx eslint . --ignore-pattern "desktop/**"

  web-typecheck:
    name: Web · Type-check
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit

  web-test:
    name: Web · Tests
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JWT_SECRET: "ci-test-secret-key-placeholder-32ch"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - run: npm test

  web-build:
    name: Web · Build
    needs: [changes, web-lint, web-typecheck, web-test]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - run: npm run build
        env:
          DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
          JWT_SECRET: "ci-build-secret-key-placeholder-32ch"

  # ── Desktop (Tauri + Vite) ─────────────────────────────────────────────────
  desktop-web:
    name: Desktop · Lint, type-check, Vite build
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      # root deps are needed: desktop/tsconfig.json compiles the shared ../src
      - run: npm ci
      - run: npm ci --ignore-scripts
        working-directory: desktop
      - run: npx eslint desktop
      - run: npx tsc --noEmit -p tsconfig.json
        working-directory: desktop
      - run: npx vite build
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-dist
          path: desktop/dist
          retention-days: 3

  desktop-tauri:
    name: Desktop · Tauri (Rust) check
    needs: [changes, desktop-web]
    if: needs.changes.outputs.desktop == 'true'
    # The desktop client targets Windows (SMTC / DPAPI behind cfg(windows)).
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: desktop-dist, path: desktop/dist }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "desktop/src-tauri -> target" }
      - run: cargo fmt --all -- --check
        working-directory: desktop/src-tauri
      - run: cargo check --locked
        working-directory: desktop/src-tauri

  # ── Rust audio engine ──────────────────────────────────────────────────────
  rust-audio:
    name: Rust · audio-engine
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: audio-engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: "rustfmt, clippy"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "audio-engine -> target" }
      - run: cargo fmt --all -- --check
      # Clippy errors (deny-level lints) fail the job; warnings are reported only.
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      - run: cargo check --target wasm32-unknown-unknown -p audio-wasm -p codec-wasm

  # ── Android (native Kotlin / Compose) ──────────────────────────────────────
  android:
    name: Android · Unit tests + debug APK
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      # Unit/parity tests run with NO flags: app/build.gradle.kts injects
      # mq.testEnv=true + mq.apiBase=http://127.0.0.1:8717 (local ParityStub);
      # production URLs fail the build/test (MqEnv, TestEnvironmentIsolationTest).
      - run: ./gradlew --no-daemon testDebugUnitTest
      # Release endpoint guard (reads the generated release BuildConfig) +
      # instrumentation sources compile (MqTestRunner isolates them too;
      # running them needs an emulator — not part of this job).
      - run: ./gradlew --no-daemon :app:checkReleaseApiConfig :app:assembleDebugAndroidTest
      - run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/test-results/
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

  # ── Repository structure (cycles, large files, parity refs) ────────────────
  repo-structure:
    name: Repo · Structure checks
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - run: node scripts/ci/check-repo-structure.mjs
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}

  # ── Summary ────────────────────────────────────────────────────────────────
  ci-summary:
    name: CI summary
    needs: [changes, web-lint, web-typecheck, web-test, web-build, desktop-web, desktop-tauri, rust-audio, android, repo-structure]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Platform results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          {
            echo "## CI by platform"
            echo ""
            echo "| Job | Result |"
            echo "|---|---|"
            echo "$RESULTS" | jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"'
            echo ""
            echo "_skipped_ = platform not touched by this change."
          } >> "$GITHUB_STEP_SUMMARY"
          bad=$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key] | join(", ")')
          if [ -n "$bad" ]; then echo "::error::Failed jobs: $bad"; exit 1; fi
          echo "All executed jobs passed."
