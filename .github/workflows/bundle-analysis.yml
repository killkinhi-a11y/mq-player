# Next.js bundle analysis report (moved out of ci.yml, same PR trigger).
# Informational only: uploads .next/analyze as an artifact.
name: Bundle analysis

"on":
  pull_request:
    branches: [main, master, develop]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bundle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Bundle analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npm run analyze
        env:
          DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
          JWT_SECRET: "ci-analyze-secret-key-placeholder-32ch"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundle-analysis
          path: .next/analyze/
          retention-days: 14
