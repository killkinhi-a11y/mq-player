name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22 (Capacitor 8 requires >=22)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          sdk-platform: '36'
          sdk-build-tools: '36.0.0'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Show environment diagnostics
        run: |
          echo "=== Node version ==="
          node --version
          echo "=== Capacitor version ==="
          node node_modules/@capacitor/cli/bin/capacitor --version 2>&1

      - name: Sync Capacitor
        run: node node_modules/@capacitor/cli/bin/capacitor sync android

      - name: Verify webDir contents
        run: |
          echo "out/ contents:"
          ls -la out/
          echo "out/index.html head (first 300 chars):"
          head -c 300 out/index.html
          echo ""
          echo "android/app/src/main/assets/capacitor.config.json:"
          cat android/app/src/main/assets/capacitor.config.json

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug -x lintVitalAnalyzeRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk mq-player.apk
          ls -lh mq-player.apk

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            mq-player.apk
          tag_name: ${{ github.ref_name || 'latest' }}
          name: MQ Player ${{ github.ref_name || 'Latest' }} — Android APK
          body: |
            ## MQ Player Android

            Приложение загружает интерфейс с https://mq1.vercel.app.
            Требуется интернет-соединение при запуске.

            ### Установка
            1. Скачайте `mq-player.apk` (~4 МБ)
            2. Откройте файл на телефоне
            3. Разрешите установку из неизвестных источников
            4. Установите и запустите

            ### PWA-альтернатива
            Откройте https://mq1.vercel.app в Chrome → меню → «Установить приложение».
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: mq-player-apk
          path: mq-player.apk
          retention-days: 30
