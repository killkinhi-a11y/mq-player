name: Build Android APK

# Build Android APK using Capacitor 8.
#
# Triggers:
#   - Push to main → build debug APK, upload as artifact (downloadable from Actions tab)
#   - Push v* tag → build signed release APK, upload to GitHub Releases
#   - workflow_dispatch → manual build (choice of debug/release)
#
# Capacitor 8 requires JDK 21 (not JDK 17 which was for Capacitor 7).
#
# Secrets for signed release (optional — falls back to debug if missing):
#   - ANDROID_SIGNING_KEY (base64-encoded .keystore file)
#   - ANDROID_ALIAS
#   - ANDROID_KEY_PASSWORD
#   - ANDROID_KEYSTORE_PASSWORD

"on":
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write  # needed by softprops/action-gh-release

jobs:
  build-android:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine build type
        id: config
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "build_type=release" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            echo "build_type=debug" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
          else
            echo "build_type=${{ inputs.build_type }}" >> $GITHUB_OUTPUT
            echo "is_release=$( [[ '${{ inputs.build_type }}' == 'release' ]] && echo true || echo false )" >> $GITHUB_OUTPUT
          fi

      - name: Generate version info
        id: version
        run: |
          # versionName: from tag (v1.0.50 → 1.0.50) or from run number
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF#refs/tags/v}"
          else
            VERSION_NAME="1.0.${{ github.run_number }}"
          fi
          # versionCode: integer, must increment. Use run_number for uniqueness.
          VERSION_CODE="${{ github.run_number }}"
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "📋 Building version $VERSION_NAME (code $VERSION_CODE)"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # capacitor-app-development skill: Capacitor 8 requires JDK 21
      - name: Set up Java (JDK 21 for Capacitor 8)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          sdk-platform: '35'
          sdk-build-tools: '35.0.0'

      - name: Install dependencies
        run: npm ci

      - name: Install Capacitor CLI (if not in package.json)
        run: |
          if ! npm ls @capacitor/cli >/dev/null 2>&1; then
            npm install -D @capacitor/cli @capacitor/core @capacitor/android @capacitor/app @capacitor/splash-screen @capgo/capacitor-media-session
          fi

      - name: Add Android platform
        run: npx cap add android || true

      - name: Generate web fallback (offline page)
        run: |
          mkdir -p out
          # offline.html is referenced in capacitor.config.ts errorPath
          # Only copy if not already present
          if [ ! -f out/offline.html ]; then
            cat > out/offline.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="ru"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
          <title>MQ Player</title>
          <style>
            * { margin:0; padding:0; box-sizing:border-box; }
            body { background:#0e0e0e; color:#fff; font-family:system-ui,sans-serif;
                   min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
            .c { text-align:center; max-width:320px; }
            .r { margin-top:24px; padding:14px 32px; background:#e03131; color:#fff;
                 border:none; border-radius:9999px; font-size:15px; font-weight:600; cursor:pointer; }
          </style></head><body><div class="c">
          <h1>Нет соединения</h1>
          <p style="opacity:0.6;margin-top:8px;font-size:14px">Проверьте интернет-подключение</p>
          <button class="r" onclick="location.reload()">Повторить</button>
          </div></body></html>
          HTMLEOF
          fi

      - name: Sync Capacitor (copy web assets + update native plugins)
        run: npx cap sync android

      - name: Generate debug keystore (for release signing config fallback)
        run: |
          if [ ! -f android/app/debug.keystore ]; then
            keytool -genkey -v -keystore android/app/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "✓ Generated debug.keystore"
          else
            echo "✓ debug.keystore already exists"
          fi

      - name: Build APK
        working-directory: android
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          echo "Building version $VERSION_NAME (code $VERSION_CODE)"
          if [ "${{ steps.config.outputs.build_type }}" = "release" ]; then
            ./gradlew assembleRelease -x lintVitalAnalyzeRelease
          else
            ./gradlew assembleDebug -x lintVitalAnalyzeRelease
          fi

      - name: Check signing secrets
        id: check_secrets
        run: |
          if [ -n "${{ secrets.ANDROID_SIGNING_KEY }}" ]; then
            echo "has_secrets=true" >> $GITHUB_OUTPUT
            echo "✓ Signing secrets available"
          else
            echo "has_secrets=false" >> $GITHUB_OUTPUT
            echo "⚠ No signing secrets — will use unsigned APK"
          fi

      - name: Sign APK (release + secrets available)
        id: sign_apk
        if: steps.config.outputs.is_release == 'true' && steps.check_secrets.outputs.has_secrets == 'true'
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
          alias: ${{ secrets.ANDROID_ALIAS }}
          password: ${{ secrets.ANDROID_KEY_PASSWORD }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "35.0.0"
        continue-on-error: true

      - name: Collect APK files
        run: |
          mkdir -p output
          # IMPORTANT: keep filename as 'mq-player.apk' (no version suffix) so the
          # permanent download link in SettingsView keeps working:
          #   https://github.com/.../releases/latest/download/mq-player.apk
          # GitHub 'releases/latest/download/' only works with exact filename match.
          # Signed release
          if [ -f "${{ steps.sign_apk.outputs.signedReleaseFile }}" ]; then
            cp "${{ steps.sign_apk.outputs.signedReleaseFile }}" output/mq-player.apk
            echo "✓ Signed release APK → mq-player.apk"
          # Unsigned release
          elif [ "${{ steps.config.outputs.build_type }}" = "release" ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk output/mq-player.apk 2>/dev/null || \
            cp android/app/build/outputs/apk/release/app-release.apk output/mq-player.apk 2>/dev/null || true
            echo "⚠ Unsigned release APK → mq-player.apk"
          # Debug
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk output/mq-player.apk
            echo "✓ Debug APK → mq-player.apk"
          fi
          ls -lh output/

      - name: Upload APK as artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: mq-player-apk-${{ steps.version.outputs.version_name }}
          path: output/*.apk
          retention-days: 30

      - name: Upload to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: output/*.apk
          tag_name: ${{ github.ref_name }}
          name: MQ Player ${{ github.ref_name }}
          body: |
            ## MQ Player Android ${{ github.ref_name }}

            ### Установка
            1. Скачайте `mq-player-${{ steps.version.outputs.version_name }}.apk`
            2. Откройте файл на телефоне
            3. Разрешите установку из неизвестных источников
            4. Установите и запустите

            ### Что нового
            [Commits с прошлого релиза](https://github.com/killkinhi-a11y/mq-player/commits/${{ github.ref_name }})

            ### PWA альтернатива
            Откройте https://mq1.vercel.app в Chrome → меню → «Установить приложение»
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
