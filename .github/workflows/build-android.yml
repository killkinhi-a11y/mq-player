name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          sdk-platform: '36'
          sdk-build-tools: '36.0.0'

      - name: Install dependencies
        run: npm ci

      - name: Install Capacitor CLI
        run: npm install @capacitor/cli @capacitor/core @capacitor/android

      - name: Add Android platform
        run: npx cap add android || true

      - name: Copy web assets
        run: |
          mkdir -p out
          cat > out/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
            <title>MQ Player</title>
            <style>
              body { margin: 0; background: #0e0e0e; font-family: system-ui, sans-serif; }
              .loader {
                position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
                width: 60px; height: 60px; border: 3px solid rgba(255,255,255,0.1);
                border-top: 3px solid #e03131; border-radius: 50%;
                animation: spin 1s linear infinite;
              }
              @keyframes spin { 0% { transform: translate(-50%,-50%) rotate(0deg); } 100% { transform: translate(-50%,-50%) rotate(360deg); } }
            </style>
          </head>
          <body><div class="loader"></div></body>
          </html>
          HTMLEOF

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK (no signing required)
        working-directory: android
        run: ./gradlew assembleDebug -x lintVitalAnalyzeRelease

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk mq-player.apk

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            mq-player.apk
          tag_name: ${{ github.ref_name || 'latest' }}
          name: MQ Player ${{ github.ref_name || 'Latest' }} — Android APK
          body: |
            ## MQ Player Android

            Нативное Android-приложение на базе Capacitor.

            ### Установка
            1. Скачайте `mq-player.apk` (~4 МБ)
            2. Откройте файл на телефоне
            3. Разрешите установку из неизвестных источников
            4. Установите и запустите

            ### PWA-альтернатива
            Откройте https://mq1.vercel.app в Chrome → меню → «Установить приложение».
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: mq-player-apk
          path: mq-player.apk
          retention-days: 30
